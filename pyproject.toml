[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-harness-framework"
version = "0.2.0"
description = "Vision application on the modality-agnostic harness core (ResNet18 ImageNet classifier on BaseStage + Pipeline)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "bohyun seo" }]
license = { text = "MIT" }

dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
