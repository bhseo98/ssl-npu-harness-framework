# Swap 비교 new: Llama-3.2-1B-Instruct + Piper (KSS Korean).
# 의도:
#   - LLM:  Qwen2.5-0.5B  → meta-llama/Llama-3.2-1B-Instruct
#           (MLIR lowering target; 한국어 품질 회귀는 trade-off)
#   - TTS:  espnet_kss (JETS, framework 의존성 무거움)
#           → Piper VITS ONNX (~63MB, CPU-first, 임베디드 친화)
# baseline 과의 정확한 비교: scripts/bench_swap.py.

pipeline:
  language: ko
  sample_rate: 16000
  budget_mb: 2048

stt:
  type: faster_whisper        # STT 는 통제 변수 — baseline 과 동일
  model: small
  language: ko
  device: auto
  compute_type: auto

llm:
  type: hf_causal
  model: meta-llama/Llama-3.2-1B-Instruct
  device: auto
  max_new_tokens: 128
  temperature: 0.7
  system_prompt: |
    You are a concise, friendly Korean voice assistant.
    Keep answers short (1-2 sentences) and natural for speech output.
    Always reply in Korean unless explicitly asked otherwise.

tts:
  type: piper
  voice: models/piper-ko/ko-kss.onnx
  device: auto

audio:
  record_seconds_max: 10
  silence_trigger: false
  output_dir: recordings

profiler:
  enabled: true
  log_path: logs/bench-swap/new.jsonl
