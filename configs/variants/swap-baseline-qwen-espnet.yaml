# Swap 비교 baseline: 기존 본 셋 (Qwen2.5-0.5B + espnet_kss).
# scripts/bench_swap.py 가 이 파일과 swap-new-llama-piper.yaml 두 개를 번갈아
# 로드해 같은 입력에 대해 latency/RAM/GPU 를 측정.

pipeline:
  language: ko
  sample_rate: 16000
  budget_mb: 2048

stt:
  type: faster_whisper
  model: small
  language: ko
  device: auto
  compute_type: auto

llm:
  type: hf_causal
  model: Qwen/Qwen2.5-0.5B-Instruct
  device: auto
  max_new_tokens: 128
  temperature: 0.7
  system_prompt: |
    You are a concise, friendly Korean voice assistant.
    Keep answers short (1-2 sentences) and natural for speech output.
    Always reply in Korean unless explicitly asked otherwise.

tts:
  type: espnet_kss
  model: imdanboy/kss_tts_train_jets_raw_phn_null_g2pk_train.total_count.ave
  device: auto

audio:
  record_seconds_max: 10
  silence_trigger: false
  output_dir: recordings

profiler:
  enabled: true
  log_path: logs/bench-swap/baseline.jsonl
